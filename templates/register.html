{% extends 'auth_base.html' %}

{% block title %}Create account · Taskly{% endblock %}

{% block auth_content %}
<h1 class="display auth-title">Start clear</h1>
<p class="auth-lede">Create an account. It takes a few seconds.</p>

<form action="{{ url_for('register') }}" method="POST" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field-group">
        <label for="username" class="field-label">Username</label>
        <input id="username" class="field" type="text" name="username" value="{{ form.get('username', '') }}"
               autocomplete="username" required minlength="3" maxlength="80" pattern="[A-Za-z0-9_.\-]{3,80}"
               title="3–80 characters: letters, numbers, dots, dashes or underscores" autofocus>
    </div>
    <div class="field-group">
        <label for="email" class="field-label">Email</label>
        <input id="email" class="field" type="email" name="email" value="{{ form.get('email', '') }}"
               autocomplete="email" required maxlength="120">
    </div>
    <div class="field-group">
        <label for="password" class="field-label">Password <span class="field-optional">8+ characters</span></label>
        <div class="password-wrap">
            <input id="password" class="field" type="password" name="password" autocomplete="new-password" required minlength="8">
            <button type="button" class="reveal" data-reveal="#password" aria-label="Show password">Show</button>
        </div>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Create account</button>
</form>

<p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}" class="text-link">Sign in</a></p>
{% endblock %}
