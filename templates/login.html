{% extends 'auth_base.html' %}

{% block title %}Sign in · Taskly{% endblock %}

{% block auth_content %}
<h1 class="display auth-title">Welcome back</h1>
<p class="auth-lede">Sign in to pick up where you left off.</p>

<form action="{{ url_for('login', next=request.args.get('next')) }}" method="POST" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field-group">
        <label for="username" class="field-label">Username or email</label>
        <input id="username" class="field" type="text" name="username" value="{{ identifier }}"
               autocomplete="username" required autofocus>
    </div>
    <div class="field-group">
        <label for="password" class="field-label">Password</label>
        <div class="password-wrap">
            <input id="password" class="field" type="password" name="password" autocomplete="current-password" required>
            <button type="button" class="reveal" data-reveal="#password" aria-label="Show password">Show</button>
        </div>
    </div>
    <label class="check-row">
        <input type="checkbox" name="remember" value="1" checked>
        <span class="check-box" aria-hidden="true"></span>
        Keep me signed in
    </label>
    <button type="submit" class="btn btn-primary btn-block">Sign in</button>
</form>

<p class="auth-switch">New to Taskly? <a href="{{ url_for('register') }}" class="text-link">Create an account</a></p>
{% endblock %}
